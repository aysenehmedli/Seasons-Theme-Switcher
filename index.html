<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seasons – Theme Switcher</title>
    <link rel="shortcut icon" href="./assets/img/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://publicawesome.web.app" crossorigin>
    <link rel="stylesheet" href="https://publicawesome.web.app/assets/fontawesome/releases/v7.3.0/css/all.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="./assets/img/logo.png" alt="">
            <h4 class="textLogo">Seasons</h4>
        </div>
        <nav>
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">About</a></li>
                <li><a href="">Services</a></li>
                <li><a href="">Contact</a></li>
            </ul>
        </nav>
        <div class="theme-btn">
            <i class="fa-jelly-fill fa-regular fa-palette"></i>
            Theme
        </div>
        <div class="themes">
            <div class="text">
                <i class="fa-jelly-fill fa-regular fa-palette paint"></i>
                <div class="info">
                    <h5>Choose Theme</h5>
                    <p>Pick your favorite theme!</p>
                </div>
            </div>
            <div class="boxes">
                <div class="snow-bg wh2 box"></div>
                <div class="spring-bg wh2 box"></div>
                <div class="summer-bg wh2 box"></div>
                <div class="autumn-bg wh2 box"></div>
            </div>
        </div>
    </header>


    <script src="./main.js"></script>
</body>

</html>
